name: Actualizar empleos LATAM

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Actualizar empleos de los 19 países
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JOB_KEYWORDS: "motorista cajero ventas auxiliar remoto"
        run: node scripts/fetch-jobs.js

      - name: Publicar JSON actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Actualiza empleos LATAM"
          git push